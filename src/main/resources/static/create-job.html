<!DOCTYPE html>
<html>
<head>
    <title>HireAI - Create Job</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="navbar">
    <div class="nav-brand">
        <span class="brand-logo">HireAI</span>
        <span class="brand-subtitle">HR Recruitment Platform</span>
    </div>

    <input type="checkbox" id="menuToggle" class="menu-toggle">

    <label for="menuToggle" class="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </label>

    <div class="nav-menu">
        <a href="dashboard.html">Dashboard</a>
        <a href="create-job.html">Create Job</a>
        <a href="upload-resume.html">Upload Resume</a>
        <a href="bulk-upload.html">Bulk Upload</a>
        <a href="candidates.html">Candidates</a>
        <a href="ranking.html">Ranking</a>
        <a href="video-interview.html">Video Interview</a>
        <a href="interview-scorecard.html">Scorecard</a>
        <a href="onboarding.html">Onboarding</a>
        <a href="job-analytics.html">Job Analytics</a>
        <a href="communication.html">Communication</a>
        <a href="offer-letter.html">Offer Letter</a>
        <a href="analytics.html">Analytics</a>

        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">
    <h1>Create Job</h1>
    <p>Create a new job opening with required skills so the system can screen resumes against it.</p>

    <div class="form-card">
        <form id="createJobForm">
            <label>Job Title</label>
            <input type="text" id="jobTitle" placeholder="Java Developer Intern" required>

            <label>Description</label>
            <textarea id="jobDescription" placeholder="Enter job description" required></textarea>

            <label>Required Skills</label>
            <input type="text" id="requiredSkills" placeholder="Java, Spring Boot, MySQL, REST API" required>

            <label>Experience</label>
            <input type="text" id="experience" placeholder="0-1 year" required>

            <button type="submit">Create Job</button>
        </form>

        <p id="jobMessage" class="message"></p>
    </div>
</div>

<script>
    function protectHRPage() {
        const user = JSON.parse(localStorage.getItem("loggedInUser"));

        if (!user) {
            window.location.href = "index.html";
            return;
        }

        const role = user.role ? user.role.toUpperCase() : "";

        if (role !== "HR" && role !== "ADMIN") {
            alert("Access denied. This page is only for HR/Admin users.");
            window.location.href = "candidate-dashboard.html";
        }
    }

    protectHRPage();

    const form = document.getElementById("createJobForm");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const user = JSON.parse(localStorage.getItem("loggedInUser"));
        const role = user && user.role ? user.role.toUpperCase() : "";

        if (role !== "HR" && role !== "ADMIN") {
            alert("Only HR/Admin users can create jobs.");
            window.location.href = "candidate-dashboard.html";
            return;
        }

        const jobData = {
            title: document.getElementById("jobTitle").value,
            description: document.getElementById("jobDescription").value,
            requiredSkills: document.getElementById("requiredSkills").value,
            experience: document.getElementById("experience").value,
            createdBy: user && user.name ? user.name : "HR User"
        };

        try {
            const response = await fetch("/api/jobs", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(jobData)
            });

            if (!response.ok) {
                throw new Error("Failed with status: " + response.status);
            }

            const data = await response.json();

            document.getElementById("jobMessage").innerText =
                "Job created successfully with ID: " + data.id;

            document.getElementById("jobMessage").style.color = "green";

            form.reset();

        } catch (error) {
            console.log("Create job error:", error);

            document.getElementById("jobMessage").innerText =
                "Failed to create job. Check console or backend logs.";

            document.getElementById("jobMessage").style.color = "red";
        }
    });

    function logout() {
        localStorage.removeItem("loggedInUser");
        window.location.href = "index.html";
    }
</script>

</body>
</html>
